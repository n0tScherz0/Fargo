[build]
  # Static site — no build step needed for local dev.
  # For Netlify with Supabase credentials, override the command in the Netlify UI
  # or set it here using environment variable injection:
  #
  #   command = "echo \"window.__FARGO_ENV__ = { SUPABASE_URL: '$SUPABASE_URL', SUPABASE_ANON_KEY: '$SUPABASE_ANON_KEY' };\" > env.js"
  #
  # Required Netlify environment variables:
  #   SUPABASE_URL        — your project URL (https://xxx.supabase.co)
  #   SUPABASE_ANON_KEY   — your project anon/public key
  publish = "."
  command = "echo \"window.__FARGO_ENV__ = { SUPABASE_URL: '$SUPABASE_URL', SUPABASE_ANON_KEY: '$SUPABASE_ANON_KEY' };\" > env.js"

# SPA routing — serve index.html for all routes so browser refresh works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
